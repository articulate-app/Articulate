# Rotates the Apple Sign in with Apple client secret (JWT, max ~6 months)
# and updates Supabase Auth via the Management API.
#
# Secrets required (never commit these):
#   APPLE_PRIVATE_KEY              # AuthKey_*.p8 PEM contents
#   APPLE_TEAM_ID                  # e.g. P2XHQTH423
#   APPLE_KEY_ID                   # e.g. J4VPPDQLW2
#   APPLE_SERVICES_ID              # e.g. com.articulate.articulateapp
#   APPLE_ADDITIONAL_CLIENT_IDS    # optional native App ID(s), comma-separated
#   SUPABASE_ACCESS_TOKEN          # https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF           # e.g. hlszgarnpleikfkwujph
#
# Schedule: monthly (keeps secret comfortably within Apple's 6-month max).
# Also runnable manually via workflow_dispatch.

name: Rotate Apple client secret

on:
  schedule:
    # 09:00 UTC on the 1st of every month
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rotate-apple-client-secret
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jose (JWT ES256)
        run: npm install --no-save jose@5.10.0

      - name: Rotate Apple secret and update Supabase
        env:
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
          APPLE_ADDITIONAL_CLIENT_IDS: ${{ secrets.APPLE_ADDITIONAL_CLIENT_IDS }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/rotate-apple-client-secret.mjs
