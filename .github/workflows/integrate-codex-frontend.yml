name: Integrate Codex frontend

on:
  push:
    branches: [ integration/codex-frontend-2026-08-17 ]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Merge Codex frontend branch safely
        shell: bash
        run: |
          set -euo pipefail
          CODEX_SHA="87631440a8fb96334d4950aca58cc62b0646023e"
          if git merge-base --is-ancestor "$CODEX_SHA" HEAD; then
            echo "Codex commit already integrated"
            exit 0
          fi

          git config user.name "articulate-app"
          git config user.email "app@whyarticulate.com"
          git fetch origin codex/frontend-updates-2026-08-17

          set +e
          git merge --no-ff --no-commit "$CODEX_SHA"
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            echo "Merge conflicts:"
            printf '%s\n' "$conflicts"
            if [ "$conflicts" != "features/ai-chat/ChatWindow.tsx" ]; then
              echo "Unexpected conflicts; aborting without push"
              git merge --abort || true
              exit 1
            fi

            # Codex contains the intended frontend scrolling/layout work in ChatWindow.
            # Take that version, then restore the newer main-only stale failure-card guard.
            git checkout --theirs -- features/ai-chat/ChatWindow.tsx
            python3 - <<'PY'
          from pathlib import Path
          p = Path('features/ai-chat/ChatWindow.tsx')
          s = p.read_text()
          needle = '''                runFailureCard={
                  m.role === "assistant"
                  && (m as InFlightAssistantMessage).terminal_state'''
          replacement = '''                runFailureCard={
                  m.role === "assistant"
                  // A failed turn remains in run history, but once the user has
                  // continued successfully it should not stay as a live Retry card.
                  && messageIndex > latestUserMessageIndex
                  && (m as InFlightAssistantMessage).terminal_state'''
          if replacement not in s:
              if needle not in s:
                  raise SystemExit('ChatWindow stale-failure guard anchor not found')
              s = s.replace(needle, replacement, 1)
              p.write_text(s)
          PY
            git add features/ai-chat/ChatWindow.tsx
          elif [ "$merge_status" -ne 0 ]; then
            echo "Merge failed without reported conflict"
            git merge --abort || true
            exit 1
          fi

          git add -A

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Commit and push merge
        shell: bash
        run: |
          if git merge-base --is-ancestor 87631440a8fb96334d4950aca58cc62b0646023e HEAD; then
            echo "Already committed"
            exit 0
          fi
          git commit -m "Merge Codex frontend updates"
          git push origin HEAD:integration/codex-frontend-2026-08-17
