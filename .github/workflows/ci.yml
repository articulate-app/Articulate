name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Apply OpenRouter ai-chat source patch
      if: github.event_name == 'push'
      run: node scripts/patch-ai-chat-openrouter.mjs

    - name: Commit patched ai-chat source
      if: github.event_name == 'push'
      shell: bash
      run: |
        if git diff --quiet -- supabase/functions/ai-chat/index.ts; then
          echo "No ai-chat source patch needed"
          exit 0
        fi
        git config user.name "articulate-app"
        git config user.email "app@whyarticulate.com"
        git add supabase/functions/ai-chat/index.ts
        git commit -m "Enable OpenRouter models in AI chat"
        git push origin HEAD:main

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Build project
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}