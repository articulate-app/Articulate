name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Apply chat UI repair patch
      if: github.event_name == 'push'
      run: node scripts/patch-chat-context-and-stale-failure.mjs

    - name: Commit repaired chat UI source
      if: github.event_name == 'push'
      shell: bash
      run: |
        if git diff --quiet -- features/ai-chat/AiChatUsageIndicator.tsx features/ai-chat/Composer.tsx features/ai-chat/ChatWindow.tsx; then
          echo "No chat UI source patch needed"
          exit 0
        fi
        git config user.name "articulate-app"
        git config user.email "app@whyarticulate.com"
        git add features/ai-chat/AiChatUsageIndicator.tsx features/ai-chat/Composer.tsx features/ai-chat/ChatWindow.tsx
        git commit -m "Fix chat context meter and stale failure card"
        git push origin HEAD:main
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linting
      run: npm run lint
    
    - name: Build project
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}