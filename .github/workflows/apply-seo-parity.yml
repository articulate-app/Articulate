name: Apply shared SEO parity patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[seo-parity]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: node scripts/patch-seo-parity.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "articulate-app"
          git config user.email "app@whyarticulate.com"
          git add features/artifacts/artifact-seo-details.tsx \
                  features/artifacts/artifact-seo-dock.tsx \
                  features/artifacts/ArtifactPane.tsx \
                  features/tasks/components/task-seo-and-ai-seo-tab.tsx
          git commit -m "[seo-parity] Align task and artifact SEO fields"
          git push origin HEAD:main
