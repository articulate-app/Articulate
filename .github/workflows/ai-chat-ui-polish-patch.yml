name: AI chat UI polish patch

on:
  push:
    branches:
      - agent/ai-chat-ui-polish

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ui-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/patch-ai-chat-ui-polish.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - run: git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "articulate-app"
          git config user.email "app@whyarticulate.com"
          git add features/ai-chat/ChatWindow.tsx features/ai-chat/Composer.tsx app/components/comments-section/task-comments-panel.tsx
          git commit -m "[ui-patch] Polish AI chat interaction UI"
          git push origin HEAD:agent/ai-chat-ui-polish
