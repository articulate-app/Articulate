name: Apply AI chat main UI patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[main-ui-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/patch-ai-chat-main-ui.mjs
      - run: git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "articulate-app"
          git config user.email "app@whyarticulate.com"
          git add features/ai-chat/ChatWindow.tsx features/ai-chat/Composer.tsx features/ai-chat/AiChatUsageIndicator.tsx app/components/comments-section/task-comments-panel.tsx
          git commit -m "[main-ui-patch] Fix AI chat interaction UI"
          git push origin HEAD:main
